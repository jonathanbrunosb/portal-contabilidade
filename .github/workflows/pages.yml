name: Publicar portal no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # O empacotamento leva tudo que está versionado, então o que não é site
      # precisa sair antes: os documentos de trabalho em .claude/, a API
      # opcional (o site publicado é estático e lê os JSON de data/) e o roteiro
      # de testes. projeto/ já fica fora pelo .gitignore; está aqui por garantia.
      - name: Remover o que não é site
        run: rm -rf .claude server projeto TESTES.md PROJETO_ESTADO_ATUAL.md PROJETO_ESTADO_RESOLVIDOS.md

      - name: Empacotar portal estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
