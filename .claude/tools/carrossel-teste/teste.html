<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste do carrossel</title>
<link rel="stylesheet" href="/css/styles.css?v=teste">
<style>
  body{margin:0;padding:24px var(--gutter,40px);background:#f3f6fa}
  .dqb{margin-bottom:20px}
  .dqb-texto > *{opacity:1!important;transform:none!important;transition:none!important}
</style>
</head>
<body>
<!-- Todos os slides no ar, um embaixo do outro, cada um no seu .dqb. Servida
     por servidor.py em /__teste.html. Parâmetros:
       so=1,3      só esses slides (posição no carrossel)
       gutter=32   margem lateral em px (40 = largura do portal em 1440)
       largura=343 largura fixa da coluna (celular: o Edge headless não abre
                   janela com menos de ~500 px; as regras de até 900 px valem)
       semtexto=1  esconde o texto (fundo para amostrar o contraste)
       caixas=1    escreve num pre#caixas, no fim da página, a caixa de cada
                   linha de texto (lida pelo contraste.py) -->
<main id="alvo"></main>
<script type="module">
import { slideHTML } from '/js/carousel.js?v=teste';
import { destaquesNoAr } from '/js/destaques.js?v=teste';
const params = new URLSearchParams(location.search);
if (params.get('gutter')) document.body.style.setProperty('--gutter', params.get('gutter') + 'px');
if (params.get('largura')) document.getElementById('alvo').style.width = params.get('largura') + 'px';
const data = {};
for (const nome of ['destaques', 'newsletter', 'noticias', 'sistemas', 'portais', 'externos', 'config']) {
  data[nome] = await (await fetch(`/data/${nome}.json`)).json();
}
const so = params.get('so');
const slides = destaquesNoAr(data).filter((s, i) => !so || so.split(',').includes(String(i + 1)));
document.getElementById('alvo').innerHTML = slides.map(s => `<div class="dqb"><div class="dqb-trilho">${slideHTML(s, 0, 1)}</div></div>`).join('');
if (params.get('semtexto')) document.head.insertAdjacentHTML('beforeend', '<style>.dqb-texto{visibility:hidden}</style>');
if (params.get('caixas')) {
  // Uma caixa por linha de texto (Range), não o parágrafo inteiro: o texto
  // curto não ocupa a coluna toda. O selo da origem tem fundo próprio: fica
  // fora. Linhas escondidas pelo line-clamp também têm caixa: saem.
  const caixas = [...document.querySelectorAll('.dqb-titulo,.dqb-subtitulo,.dqb-descricao,.dqb-acao,.dqb-rotulo')].flatMap(el => {
    const cs = getComputedStyle(el);
    const faixa = document.createRange();
    faixa.selectNodeContents(el);
    const visivel = el.getBoundingClientRect();
    return [...faixa.getClientRects()].filter(r => r.width > 2 && r.bottom <= visivel.bottom + 1).map(r => ({
      slide: el.closest('.dqb-slide').querySelector('.dqb-titulo').textContent.slice(0, 30), classe: el.className,
      x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height), cor: cs.color,
      grande: parseFloat(cs.fontSize) >= 24 || (parseFloat(cs.fontSize) >= 18.66 && Number(cs.fontWeight) >= 700) }));
  });
  const pre = document.createElement('pre');
  pre.id = 'caixas';
  pre.textContent = JSON.stringify(caixas);
  document.body.append(pre);
}
</script>
</body>
</html>
